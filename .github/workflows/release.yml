name: Release

on:
  push:
    branches:
      - active
  workflow_run:
    workflows:
      - Dependabot Auto-Merge
    types:
      - completed

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  decide:
    name: Decide Release Context
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      release_sha: ${{ steps.decide.outputs.release_sha }}
      release_timestamp: ${{ steps.timestamp.outputs.release_timestamp }}

    steps:
      - name: Decide whether to publish a release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "event_name=${{ github.event_name }}"
          echo "github_ref=${GITHUB_REF}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"
            echo "workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"
            echo "workflow_run.head_sha=${{ github.event.workflow_run.head_sha }}"
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "decision=skip"
              echo "reason=workflow_run_not_success"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            active_sha=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/branches/active" \
              --jq '.commit.sha')

            if [ -z "$active_sha" ] || [ "$active_sha" = "null" ]; then
              echo "ERROR: could not resolve active branch head SHA." >&2
              exit 1
            fi

            latest_target=$(gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 1 \
              --json targetCommitish \
              --jq '.[0].targetCommitish')

            echo "active_sha=${active_sha}"
            echo "latest_release_target=${latest_target}"

            if [ -n "$latest_target" ] && [ "$latest_target" != "null" ] && [ "$latest_target" = "$active_sha" ]; then
              echo "decision=skip"
              echo "reason=latest_release_targets_active_sha"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "decision=release"
            echo "release_sha=${active_sha}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$active_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Standard trigger path, using current SHA: $GITHUB_SHA"
          echo "decision=release"
          echo "release_sha=${GITHUB_SHA}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Compute release timestamp
        id: timestamp
        if: ${{ steps.decide.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "release_timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests
    if: ${{ needs.decide.outputs.should_release == 'true' }}
    needs:
      - decide
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.decide.outputs.release_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  build:
    name: Build release artifacts
    if: ${{ needs.decide.outputs.should_release == 'true' }}
    needs:
      - decide
      - test
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.decide.outputs.release_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Build release artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist
          asset_name="dockerfile-parser-json-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset_name="${asset_name}.exe"
          fi

          go build -trimpath -ldflags "-s -w" -o "dist/$asset_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create GitHub release
    if: ${{ needs.decide.outputs.should_release == 'true' }}
    needs:
      - decide
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.decide.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          release_timestamp="${{ needs.decide.outputs.release_timestamp }}"
          release_tag="Release-${release_timestamp}"

          echo "release_tag=${release_tag}"
          echo "release_sha=${{ needs.decide.outputs.release_sha }}"
          echo "artifact_count=${#files[@]}"
          if [ ${#files[@]} -gt 0 ]; then
            printf 'artifact=%s\n' "${files[@]}"
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/."
            exit 1
          fi

          release_lookup_err_file=$(mktemp)
          if release_lookup_json=$(gh release view "$release_tag" --json id,tagName,targetCommitish,url 2>"$release_lookup_err_file"); then
            echo "release_exists=true"
            printf '%s\n' "$release_lookup_json"
            gh release edit "$release_tag" --generate-notes
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            release_lookup_error=$(cat "$release_lookup_err_file")
            if printf '%s\n' "$release_lookup_error" | grep -Eq '^release not found'; then
              echo "release_exists=false"
              gh release create "$release_tag" "${files[@]}" \
                --target "${{ needs.decide.outputs.release_sha }}" \
                --generate-notes
            else
              echo "ERROR: release lookup failed for tag ${release_tag}" >&2
              printf '%s\n' "$release_lookup_error"
              rm -f "$release_lookup_err_file"
              exit 1
            fi
          fi

          rm -f "$release_lookup_err_file"
