name: Release

on:
  push:
    branches:
      - active

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_timestamp: ${{ steps.timestamp.outputs.release_timestamp }}

    steps:
      - name: Compute release timestamp
        id: timestamp
        shell: bash
        run: echo "release_timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  build:
    needs:
      - prepare
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build release artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          asset_name="dockerfile-parser-json-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset_name="${asset_name}.exe"
          fi

          go build -trimpath -ldflags "-s -w" -o "dist/$asset_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          notes_json=$(mktemp)
          notes_file=$(mktemp)
          repo_name="${GITHUB_REPOSITORY#*/}"
          release_timestamp="${{ needs.prepare.outputs.release_timestamp }}"
          release_tag="Release-${release_timestamp}"
          release_name="${repo_name} @ ${release_timestamp} UTC"

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/."
            exit 1
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="$GITHUB_SHA" > "$notes_json"

          generated_name=$(jq -r '.name' "$notes_json")
          jq -r '.body' "$notes_json" > "$notes_file"

          if [ -n "$generated_name" ] && [ "$generated_name" != "null" ]; then
            release_name="$generated_name"
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_name" --notes-file "$notes_file"
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            gh release create "$release_tag" "${files[@]}" --target "$GITHUB_SHA" --title "$release_name" --notes-file "$notes_file"
          fi
