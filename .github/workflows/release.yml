name: Release

on:
  push:
    branches:
      - active
  workflow_run:
    workflows:
      - Dependabot Auto-Merge
    types:
      - completed

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  decide:
    name: Check release requirements
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      release_sha: ${{ steps.decide.outputs.release_sha }}
      release_timestamp: ${{ steps.timestamp.outputs.release_timestamp }}

    steps:
      - name: Decide whether to publish a release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "[release] event_name=${{ github.event_name }}"
          echo "[release] github.ref=${GITHUB_REF}"
          echo "[release] workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "[release] workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "[release] workflow_run.head_sha=${{ github.event.workflow_run.head_sha }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "[release] path=push -> releasing ${GITHUB_SHA}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "[release] workflow_run conclusion is not success -> skip"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active_sha=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/branches/active" \
            --jq '.commit.sha')

          if [ -z "$active_sha" ] || [ "$active_sha" = "null" ]; then
            echo "[release] could not resolve active branch head SHA -> skip"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_target=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '.target_commitish' 2>/dev/null || true)

          echo "[release] active_sha=${active_sha}"
          echo "[release] latest_release_target=${latest_target}"

          if [ -n "$latest_target" ] && [ "$latest_target" != "null" ] && [ "$latest_target" = "$active_sha" ]; then
            echo "[release] decision=skip (latest release already targets active head)"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[release] decision=release (active head differs from latest release target)"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$active_sha" >> "$GITHUB_OUTPUT"

      - name: Compute release timestamp
        id: timestamp
        if: ${{ steps.decide.outputs.should_release == 'true' }}
        shell: bash
        run: echo "release_timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests
    if: ${{ needs.decide.outputs.should_release == 'true' }}
    needs:
      - decide
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.release_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  build:
    name: Build release artifacts
    if: ${{ needs.decide.outputs.should_release == 'true' }}
    needs:
      - decide
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.release_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build release artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          asset_name="dockerfile-parser-json-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset_name="${asset_name}.exe"
          fi

          go build -trimpath -ldflags "-s -w" -o "dist/$asset_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create GitHub release
    if: ${{ needs.decide.outputs.should_release == 'true' }}
    needs:
      - decide
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          notes_json=$(mktemp)
          notes_file=$(mktemp)
          repo_name="${GITHUB_REPOSITORY#*/}"
          release_timestamp="${{ needs.decide.outputs.release_timestamp }}"
          release_tag="Release-${release_timestamp}"
          release_name="${repo_name} @ ${release_timestamp} UTC"

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/."
            exit 1
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="${{ needs.decide.outputs.release_sha }}" > "$notes_json"

          generated_name=$(jq -r '.name' "$notes_json")
          jq -r '.body' "$notes_json" > "$notes_file"

          if [ -n "$generated_name" ] && [ "$generated_name" != "null" ]; then
            release_name="$generated_name"
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_name" --notes-file "$notes_file"
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            gh release create "$release_tag" "${files[@]}" --target "${{ needs.decide.outputs.release_sha }}" --title "$release_name" --notes-file "$notes_file"
          fi
